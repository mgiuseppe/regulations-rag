name: regulations-rag # useful to share the same instance between different worktrees (by default docker would have used the folder name as prefix for containers)
services:
  qdrant:
    image: qdrant/qdrant:v1.19
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: regulations_rag
      POSTGRES_PASSWORD: regulations_rag
      POSTGRES_DB: regulations_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  postgres_data:
